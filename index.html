<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>컴피리아 메모장</title>
    <style>
        /* 전체적인 디자인과 글꼴 설정 */
        body {
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        /* 중앙 박스 디자인 */
        .card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            line-height: 1.5;
        }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>환영합니다! 👋</h1>
        <p>이 페이지는 GitHub Pages를 통해 무료로 배포된 <strong>컴피리아 홈페이지</strong>입니다.</p>
        <p>원하는 내용을 마음껏 수정해서 나만의 공간을 만들어보세요.</p>
        <a href="https://github.com/PluMaZero" class="target btn" target="_blank">내 깃허브 가기</a>
    </div>

</body>
</html>
